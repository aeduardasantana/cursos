name: Publicar GEB Cursos na Locaweb

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - "assets/**"
      - "vocabulario-estrategico/**"
      - "nr-1/**"
      - "aulas/**"
      - "ferramentas/**"
      - "glossario/**"
      - "acessibilidade/**"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: geb-academia-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar a estrutura e JavaScript
        run: |
          test -s index.html
          test -s assets/styles.css
          test -s assets/app.js
          test -s assets/glossario.json
          test -s nr-1/index.html
          test -s nr-1/modulo-01/aula-00/index.html
          test -s nr-1/modulo-12/aula-03/index.html
          test -s vocabulario-estrategico/index.html
          test -s aulas/markup/index.html
          test -s ferramentas/markup/index.html
          test -s glossario/index.html
          node --check assets/app.js
          test -s vocabulario-estrategico/modulo-01/index.html
          test -s vocabulario-estrategico/modulo-11/index.html
          test -s vocabulario-estrategico/modulo-03/aula-02/index.html
          python3 -m json.tool assets/glossario.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          termos=json.loads(Path("assets/glossario.json").read_text(encoding="utf-8"))
          assert len(termos)==90, f"Esperados 90 termos, encontrados {len(termos)}"
          for nome in ("index.html","nr-1/index.html","vocabulario-estrategico/index.html","vocabulario-estrategico/modulo-03/aula-02/index.html","glossario/index.html"):
              conteudo=Path(nome).read_text(encoding="utf-8")
              assert 'lang="pt-BR"' in conteudo, f"{nome} sem idioma"
              assert "vlibras.gov.br/app/vlibras-plugin.js" in conteudo, f"{nome} sem VLibras"
          print("Validação estrutural concluída.")
          PY
      - name: Auditar idioma e apresentação do catálogo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paginas = [Path("index.html"), Path("nr-1/index.html"), Path("vocabulario-estrategico/index.html"), Path("vocabulario-estrategico/modulo-03/aula-02/index.html"), Path("glossario/index.html"), Path("acessibilidade/index.html")]
          for pagina in paginas:
              html = pagina.read_text(encoding="utf-8").lower()
              assert "geb academia" in html, f"Identidade ausente: {pagina}"
              assert "vlibras.gov.br/app/vlibras-plugin.js" in html, f"VLibras ausente: {pagina}"
              for termo in ("não homologado", "aula demonstrativa", "formação autoral · em revisão"):
                  assert termo not in html, f"Texto editorial de status encontrado: {pagina}: {termo}"
          audio=Path("assets/app.js").read_text(encoding="utf-8")
          assert '"Ponto de equilíbrio (break-even)"' in audio
          assert '["break-even","en-US"]' in audio
          assert '["Ponto de equilíbrio","pt-BR"]' in audio
          import json, pathlib
          termos=json.loads(pathlib.Path("assets/glossario.json").read_text(encoding="utf-8"))
          aulas=sorted(pathlib.Path("vocabulario-estrategico").glob("modulo-*/index.html"))
          assert len(aulas)==11, "Módulos incompletos"
          for aula in aulas:
              html=aula.read_text(encoding="utf-8")
              assert "chapter-quiz-form" in html and "concept-listen" in html
              assert "educacao@grupoeduardabispo.com.br" in html
          extra=pathlib.Path("vocabulario-estrategico/modulo-03/aula-02/index.html").read_text(encoding="utf-8")
          assert "MÓDULO 03 · AULA 02" in extra
          indice=pathlib.Path("vocabulario-estrategico/index.html").read_text(encoding="utf-8")
          assert "Leitura complementar · Markup" not in indice
          assert "/aulas/markup/" not in indice
          print("Doze aulas do Vocabulário Executivo verificadas, com markup dentro do módulo 03.")
          nr1=sorted(pathlib.Path("nr-1").glob("modulo-*/aula-*/index.html"))
          assert len(nr1)==37, f"Esperadas 37 aulas NR-1, encontradas {len(nr1)}"
          for aula in nr1:
              texto=aula.read_text(encoding="utf-8")
              assert 'data-read-content' in texto and 'chapter-pager' in texto
              assert "educacao@grupoeduardabispo.com.br" in texto
              assert "vlibras.gov.br/app/vlibras-plugin.js" in texto
              assert "docs.google.com" not in texto, f"Link interno do Drive em {aula}"
              assert "AUTOCORREÇÃO DO PROFESSOR" not in texto
          assert "course-completion-cta" in nr1[-1].read_text(encoding="utf-8")
          vocab=pathlib.Path("vocabulario-estrategico/modulo-11/index.html").read_text(encoding="utf-8")
          assert "course-completion-cta" in vocab
          print("37 aulas NR-1 e os CTAs de encerramento verificados.")
          print("Auditoria editorial e de pronúncia inicial concluída.")
          PY

      - name: Publicar somente a pasta de Cursos
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "./"
          remoteDir: "./public_html/cursos/"
          options: "--exclude-glob .git/** --exclude-glob .github/** --exclude-glob README.md --exclude-glob CNAME"
